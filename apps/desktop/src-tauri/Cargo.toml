[package]
name = "solo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Solo IDE - AI-native development environment"

[lib]
name = "solo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "solo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
solo-core = { path = "../../../crates/solo-core" }
solo-protocol = { path = "../../../crates/solo-protocol" }
solo-fs = { path = "../../../crates/solo-fs" }
solo-auth = { path = "../../../crates/solo-auth" }
solo-parse = { path = "../../../crates/solo-parse" }
solo-embeddings = { path = "../../../crates/solo-embeddings" }
solo-git = { path = "../../../crates/solo-git" }
solo-plugins = { path = "../../../crates/solo-plugins" }
solo-vault = { path = "../../../crates/solo-vault" }
solo-elevenlabs = { path = "../../../crates/solo-elevenlabs" }
solo-stats = { path = "../../../crates/solo-stats" }

tauri = { workspace = true, features = ["macos-private-api"] }
uuid = { version = "1.11", features = ["v4"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-macos-permissions = "2"

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webbrowser = "1.0"
portable-pty = "0.8"

# Auth dependencies
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
urlencoding = "2"
dotenvy = "0.15"
once_cell = "1.19"
tauri-plugin-decorum = "1.1.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
git2.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

# Agent bridge dependencies
crossbeam-channel = "0.5"
parking_lot = "0.12"
hashbrown = { version = "0.15", features = ["serde"] }
thiserror.workspace = true
async-trait.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
