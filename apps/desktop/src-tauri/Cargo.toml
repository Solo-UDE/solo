[package]
name = "solo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Solo IDE - AI-native development environment"

[lib]
name = "solo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "solo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
solo-core = { path = "../../../crates/solo-core" }
solo-protocol = { path = "../../../crates/solo-protocol" }
solo-fs = { path = "../../../crates/solo-fs" }
solo-agent = { path = "../../../crates/solo-agent" }
solo-parse = { path = "../../../crates/solo-parse" }
solo-embeddings = { path = "../../../crates/solo-embeddings" }

tauri.workspace = true
uuid = { version = "1.11", features = ["v4"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webbrowser = "1.0"

# Auth dependencies
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
urlencoding = "2"
dotenvy = "0.15"
once_cell = "1.19"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
