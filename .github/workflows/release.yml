name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: must match apps/desktop/src-tauri/tauri.conf.json'
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
      SOLO_COGNITO_DOMAIN: ${{ vars.SOLO_PROD_COGNITO_DOMAIN }}
      SOLO_COGNITO_CLIENT_ID: ${{ vars.SOLO_PROD_COGNITO_CLIENT_ID }}
      SOLO_AWS_REGION: ${{ vars.SOLO_PROD_AWS_REGION }}
      SOLO_API_ENDPOINT: ${{ vars.SOLO_PROD_API_ENDPOINT }}
      SOLO_VAULT_API_ENDPOINT: ${{ vars.SOLO_PROD_VAULT_API_ENDPOINT }}
      RELEASE_INPUT_VERSION: ${{ github.event.inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release source
        run: |
          set -euo pipefail

          git fetch origin master

          CONFIG_VERSION="$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)"
          test -n "$CONFIG_VERSION" && test "$CONFIG_VERSION" != "null"

          if [ -n "${RELEASE_INPUT_VERSION:-}" ] && [ "$RELEASE_INPUT_VERSION" != "$CONFIG_VERSION" ]; then
            echo "Workflow input version '$RELEASE_INPUT_VERSION' does not match tauri.conf.json version '$CONFIG_VERSION'" >&2
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "master" ]; then
              echo "Manual releases must be run from the master branch, not '$GITHUB_REF_NAME'." >&2
              exit 1
            fi
            exit 0
          fi

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$CONFIG_VERSION" ]; then
              echo "Tag version '$TAG_VERSION' does not match tauri.conf.json version '$CONFIG_VERSION'" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "Release tag '$GITHUB_REF_NAME' must point to a commit reachable from origin/master." >&2
              exit 1
            fi
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Generate TypeScript bindings
        run: bun run gen:bindings

      - name: Typecheck frontend
        run: cd apps/desktop && bunx tsc --noEmit

      - name: Validate desktop auth config
        run: |
          test -n "$SOLO_COGNITO_DOMAIN" || { echo "Missing SOLO_PROD_COGNITO_DOMAIN" >&2; exit 1; }
          test -n "$SOLO_COGNITO_CLIENT_ID" || { echo "Missing SOLO_PROD_COGNITO_CLIENT_ID" >&2; exit 1; }
          test -n "$SOLO_AWS_REGION" || { echo "Missing SOLO_PROD_AWS_REGION" >&2; exit 1; }
          test -n "$SOLO_API_ENDPOINT" || { echo "Missing SOLO_PROD_API_ENDPOINT" >&2; exit 1; }
          test -n "$SOLO_VAULT_API_ENDPOINT" || { echo "Missing SOLO_PROD_VAULT_API_ENDPOINT" >&2; exit 1; }

      - name: Prepare Apple notarization key
        run: |
          test -n "$APPLE_API_KEY_ID" || { echo "Missing APPLE_API_KEY_ID" >&2; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "Missing APPLE_API_ISSUER" >&2; exit 1; }
          test -n "$APPLE_API_KEY_P8_BASE64" || { echo "Missing APPLE_API_KEY_P8_BASE64" >&2; exit 1; }

          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"

      - name: Import Apple certificate
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Tauri app (unsigned .app only)
        run: |
          cd apps/desktop
          bunx tauri build --target aarch64-apple-darwin --bundles app \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Bundle macOS runtime dylibs
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3

          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/Solo.app"
          BIN_PATH="$APP_PATH/Contents/MacOS/solo-desktop"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          RELEASE_DIR="target/aarch64-apple-darwin/release"

          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH" >&2; exit 1; }
          mkdir -p "$FRAMEWORKS"

          for name in libonnxruntime.1.17.1.dylib libsherpa-onnx-c-api.dylib libsherpa-onnx-cxx-api.dylib; do
            src=""
            for dir in "$RELEASE_DIR" "$RELEASE_DIR/deps"; do
              if [ -f "$dir/$name" ]; then
                src="$dir/$name"
                break
              fi
            done
            test -n "$src" || { echo "Missing required dylib: $name" >&2; exit 1; }
            cp -f "$src" "$FRAMEWORKS/$name"
          done

          ln -sf libonnxruntime.1.17.1.dylib "$FRAMEWORKS/libonnxruntime.dylib"

          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          cp -f "$OPENSSL_PREFIX/lib/libssl.3.dylib" "$FRAMEWORKS/libssl.3.dylib"
          cp -f "$OPENSSL_PREFIX/lib/libcrypto.3.dylib" "$FRAMEWORKS/libcrypto.3.dylib"
          chmod u+w "$FRAMEWORKS"/*.dylib

          if ! otool -l "$BIN_PATH" | awk '/cmd LC_RPATH/{flag=1} flag && /path @executable_path\/\.\.\/Frameworks/{found=1} END{exit found?0:1}'; then
            install_name_tool -add_rpath @executable_path/../Frameworks "$BIN_PATH"
          fi

          rewrite_dependency() {
            local file="$1"
            local dylib_name="$2"
            local replacement="$3"
            otool -L "$file" | awk -v suffix="/${dylib_name}" '$1 ~ suffix "$" { print $1 }' | while IFS= read -r dep; do
              if [ "$dep" != "$replacement" ]; then
                install_name_tool -change "$dep" "$replacement" "$file"
              fi
            done
          }

          install_name_tool -id @rpath/libssl.3.dylib "$FRAMEWORKS/libssl.3.dylib"
          install_name_tool -id @rpath/libcrypto.3.dylib "$FRAMEWORKS/libcrypto.3.dylib"
          rewrite_dependency "$BIN_PATH" libssl.3.dylib @rpath/libssl.3.dylib
          rewrite_dependency "$BIN_PATH" libcrypto.3.dylib @rpath/libcrypto.3.dylib
          rewrite_dependency "$FRAMEWORKS/libssl.3.dylib" libcrypto.3.dylib @rpath/libcrypto.3.dylib

          otool -L "$BIN_PATH"
          otool -L "$FRAMEWORKS/libssl.3.dylib"

      - name: Code-sign app (inside-out)
        run: |
          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/Solo.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH" >&2; exit 1; }

          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          if [ -d "$FRAMEWORKS" ]; then
            find "$FRAMEWORKS" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 | \
              xargs -0 -I {} codesign --force --sign "$APPLE_SIGN_IDENTITY" \
                --options runtime --timestamp "{}"
            find "$FRAMEWORKS" -type d -name "*.framework" -print0 | \
              xargs -0 -I {} codesign --force --sign "$APPLE_SIGN_IDENTITY" \
                --options runtime --timestamp "{}"
          fi

          while IFS= read -r -d '' SIDECAR; do
            codesign --force --sign "$APPLE_SIGN_IDENTITY" \
              --options runtime --timestamp "$SIDECAR"
          done < <(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f \( -name "agent-bridge" -o -name "agent-bridge-*" \) -print0)

          codesign --force --sign "$APPLE_SIGN_IDENTITY" \
            --options runtime --timestamp \
            --entitlements apps/desktop/src-tauri/Entitlements.plist \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and staple
        run: |
          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/Solo.app"
          ZIP_PATH="$RUNNER_TEMP/Solo.zip"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          xcrun notarytool submit "$ZIP_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH" || {
            echo "Gatekeeper assessment failed" >&2
            exit 1
          }

      - name: Reclaim disk space before DMG
        run: |
          df -h /
          # Keep the release binary/bundle, drop intermediate compile artifacts and node_modules
          rm -rf target/aarch64-apple-darwin/release/deps
          rm -rf target/aarch64-apple-darwin/release/build
          rm -rf target/aarch64-apple-darwin/release/incremental
          rm -rf target/aarch64-apple-darwin/release/.fingerprint
          rm -rf node_modules
          rm -rf apps/desktop/node_modules
          rm -rf ~/.cargo/registry/src
          df -h /

      - name: Create DMG
        run: |
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/Solo.app"
          STAGING="$RUNNER_TEMP/dmg-staging"
          DMG_NAME="Solo_${VERSION}_aarch64.dmg"
          DMG_PATH="$RUNNER_TEMP/$DMG_NAME"

          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/Solo.app"
          ln -s /Applications "$STAGING/Applications"

          for attempt in 1 2 3; do
            if hdiutil create -volname "Solo" -srcfolder "$STAGING" \
                -ov -format UDZO -imagekey zlib-level=9 "$DMG_PATH"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "hdiutil failed after 3 attempts" >&2
              exit 1
            fi
            rm -f "$DMG_PATH"
            sleep 5
          done

          codesign --force --sign "$APPLE_SIGN_IDENTITY" --timestamp "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vvv -t open --context context:primary-signature "$DMG_PATH"

          mkdir -p dist
          mv "$DMG_PATH" "dist/$DMG_NAME"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Create updater archive and sign
        run: |
          APP_PATH="target/aarch64-apple-darwin/release/bundle/macos/Solo.app"
          TAR_PATH="dist/Solo.app.tar.gz"

          tar -czf "$TAR_PATH" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"

          cd apps/desktop
          bunx tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "../../$TAR_PATH"

          test -f "../../${TAR_PATH}.sig" || {
            echo "Expected ../../${TAR_PATH}.sig to exist" >&2
            exit 1
          }

      - name: Generate latest.json
        run: |
          TAG_NAME="v${VERSION}"
          SIGNATURE=$(cat dist/Solo.app.tar.gz.sig)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME")
          if [ -z "$NOTES" ]; then
            NOTES="Solo $VERSION"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg signature "$SIGNATURE" \
            --arg url "https://github.com/Solo-UDE/solo-releases/releases/download/${TAG_NAME}/Solo.app.tar.gz" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  signature: $signature,
                  url: $url
                }
              }
            }' > dist/latest.json

          cat dist/latest.json

      - name: Publish release to solo-releases
        run: |
          TAG_NAME="v${VERSION}"
          NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME")
          if [ -z "$NOTES" ]; then
            NOTES="Solo $VERSION"
          fi

          GH_TOKEN="$RELEASE_PAT" gh release create "$TAG_NAME" \
            --repo Solo-UDE/solo-releases \
            --title "Solo v$VERSION" \
            --notes "$NOTES" \
            "dist/$DMG_NAME" \
            dist/Solo.app.tar.gz \
            dist/Solo.app.tar.gz.sig \
            dist/latest.json

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
