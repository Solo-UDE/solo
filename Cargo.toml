[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2021"
license = "MIT"
authors = ["Solo Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TypeScript bindings
ts-rs = { version = "10.1", features = ["serde-compat"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tauri
tauri = "2.2"
tauri-build = "2.0"

# Git
git2 = "0.20.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HTTP
reqwest = { version = "0.12", features = ["stream"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# Cryptography
sha2 = "0.10"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Numeric computing
ndarray = "0.16"

# ONNX Runtime (pinned for rc stability)
ort = "2.0.0-rc.11"

# Audio
cpal = "0.15"
hound = "3.5"

# Speech recognition
sherpa-rs = "0.6"
