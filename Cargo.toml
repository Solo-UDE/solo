[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0-beta.1"
edition = "2021"
license = "MIT"
authors = ["Solo Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# TypeScript bindings
ts-rs = { version = "10.1", features = ["serde-compat"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Tauri
tauri = "2.2"
tauri-build = "2.0"

# Git
git2 = "0.20.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Audio + ML for solo-voice
cpal = "0.15"
# TODO: bump to "2.0" once crates.io publishes a stable 2.0.0 (currently rc-only).
ort = { version = "2.0.0-rc", features = ["download-binaries", "ndarray"] }
ndarray = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
hound = "3.5"

# Sherpa-ONNX Rust bindings (ships the sherpa-onnx C++ lib as a sub-build)
sherpa-rs = "0.6"
