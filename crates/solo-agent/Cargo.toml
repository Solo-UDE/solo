[package]
name = "solo-agent"
version = "0.1.0"
edition = "2021"
description = "AI agent for Solo IDE (session management, tools, models)"
license = "MIT"

[dependencies]
# Core crates
solo-core = { path = "../solo-core" }
solo-protocol = { path = "../solo-protocol" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async trait support
async-trait = "0.1"

# Logging
tracing = "0.1"

# UUID for message/tool IDs
uuid = { version = "1.0", features = ["v4"] }

# File globbing (used by tools)
glob = "0.3"

# TypeScript bindings
ts-rs = { version = "10.1", features = ["serde-compat"] }

# macOS keychain for API key storage
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"
