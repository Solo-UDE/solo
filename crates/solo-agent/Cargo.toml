[package]
name = "solo-agent"
version = "0.1.0"
edition = "2021"
description = "Multi-provider AI agent for Solo IDE"
license = "MIT"

[dependencies]
# Core crates
solo-core = { path = "../solo-core" }
solo-protocol = { path = "../solo-protocol" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async trait support
async-trait = "0.1"

# Logging
tracing = "0.1"

# UUID for message/tool IDs
uuid = { version = "1.0", features = ["v4"] }

# Event streaming (SSE)
eventsource-stream = "0.2"

# Lazy static for model registry
lazy_static = "1.5"

# OAuth dependencies
base64 = "0.22"
sha2 = "0.10"
url = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.2"
urlencoding = "2"

# File globbing
glob = "0.3"

# TypeScript bindings
ts-rs = { version = "10.1", features = ["serde-compat"] }

# OpenTelemetry (optional)
opentelemetry = { version = "0.28", optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"], optional = true }
opentelemetry-stdout = { version = "0.28", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = []
telemetry = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-stdout", "tracing-opentelemetry", "tracing-subscriber"]
