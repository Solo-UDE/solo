[package]
name = "solo-auth"
version = "0.1.0"
edition = "2021"
description = "Authentication, credentials, and provider management for Solo IDE"
license = "MIT"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# TypeScript bindings
ts-rs = { version = "10.1", features = ["serde-compat"] }

# OAuth dependencies
base64 = "0.22"
sha2 = "0.10"
url = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.2"
urlencoding = "2"

# Lazy static for model registry
lazy_static = "1.5"

# macOS Keychain (native API, no shell spawning)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"
