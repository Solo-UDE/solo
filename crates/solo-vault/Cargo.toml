[package]
name = "solo-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent memory vault — drag-drop indexing, semantic search, hybrid cloud sync"

[dependencies]
# Workspace
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Local crates
solo-core = { path = "../solo-core" }
solo-protocol = { path = "../solo-protocol" }
solo-fs = { path = "../solo-fs" }
solo-parse = { path = "../solo-parse" }
solo-embeddings = { path = "../solo-embeddings" }

# Local ONNX-backed embedding model (MiniLM / BGE / E5 / etc.).
# Vault ships with `all-MiniLM-L6-v2` (384 dims) so users get semantic
# retrieval for free — no OpenAI key, no network per query, no per-user
# cost. Model is lazy-downloaded on first use to `~/.solo/vault/models/`.
fastembed = "5"

# SQLite with FTS5 (bundled — no system dep, consistent across platforms)
rusqlite = { version = "0.32", features = ["bundled"] }

# Classifier + hashing
mime_guess = "2.0"
sha2 = "0.10"

# IDs + paths
uuid = { version = "1.11", features = ["v4"] }
dirs = "5.0"

[dev-dependencies]
tempfile = "3.14"
